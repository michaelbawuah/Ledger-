name: C++ verification
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DLEDGER_REQUIRE_GTEST=ON
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/portable -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/portable --config Release --parallel 2
      - run: ctest --test-dir build/portable -C Release --output-on-failure
  parser-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset fuzz && cmake --build --preset fuzz --parallel 2
      - run: python3 tools/make_fuzz_corpus.py build/corpus && build/fuzz/ledger_parser_fuzz build/corpus -max_total_time=30 -timeout=5
  study-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the plotting dependency
        run: python -m pip install matplotlib==3.10.8
      - name: Audit committed study data and plotted numeric series
        run: python tools/verify_study.py --study-root bench/results/study --plot-manifest docs/figures/study/plot-manifest.json --out build/committed-study-audit.json
      - name: Rebuild measured figures from raw data
        run: python tools/plot_study.py --study-root bench/results/study --core-root bench/results/core-v2 --strategy-trace bench/results/strategy-study/trace.csv --spsc-root bench/results/spsc-study --outdir build/reproduced-figures --png
      - name: Rebuild exact engine diagrams
        run: python tools/draw_architecture.py --outdir build/reproduced-figures
      - name: Audit reproduced figure values and source hashes
        run: python tools/verify_study.py --study-root bench/results/study --plot-manifest build/reproduced-figures/plot-manifest.json --out build/reproduced-study-audit.json
      - name: Verify plotting calculations and tamper rejection
        run: python -m unittest discover -s tests/tooling -p 'test_plot_study.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-study-figures
          path: |
            build/reproduced-figures
            build/committed-study-audit.json
            build/reproduced-study-audit.json
  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset tsan -DCMAKE_CXX_COMPILER=clang++ && cmake --build --preset tsan --target ledger_spsc_tests --parallel 2
      - run: build/tsan/ledger_spsc_tests
  long-differential:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset release && cmake --build --preset release --parallel 2
      - run: build/release/ledger_differential --seeds 100 --orders 1000000
